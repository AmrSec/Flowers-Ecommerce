<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#f45d96', darkBg: '#0f0f0f', darkCard: '#1a1a1a' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Shopping Cart</title>
</head>
<body class="bg-gray-100 dark:bg-darkBg pt-32 px-6 lg:px-20 transition-colors duration-300">
    <nav class="flex justify-between items-center px-6 py-4 lg:px-12 fixed top-0 left-0 right-0 bg-white dark:bg-darkCard z-[1000] shadow-md">
        <div class="nav__logo"><img src="../images/logo.png" class="h-10" alt="logo"></div>
        <a href="home.html" class="text-primary font-bold uppercase text-sm tracking-widest">Back to Store</a>
    </nav>

    <div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-10">
        <div class="flex-grow bg-white dark:bg-darkCard rounded-2xl shadow-sm p-8">
            <table class="w-full text-left">
                <thead class="border-b border-gray-100 dark:border-gray-800 text-xs font-bold uppercase text-gray-400">
                    <tr>
                        <th class="pb-4">Product</th>
                        <th class="pb-4">Price</th>
                        <th class="pb-4">Quantity</th>
                        <th class="pb-4">Total</th>
                    </tr>
                </thead>
                <tbody class="cart__body divide-y divide-gray-50 dark:divide-gray-800 text-gray-700 dark:text-gray-200">
                    </tbody>
            </table>
        </div>

        <div class="w-full lg:w-80 h-fit bg-white dark:bg-darkCard rounded-2xl shadow-sm p-8 sticky top-32">
            <h2 class="text-xl font-bold mb-6 dark:text-white">Summary</h2>
            <div class="flex justify-between font-bold text-2xl mb-8">
                <span class="dark:text-white">Total:</span>
                <span class="text-primary subtotal-val">$0.00</span>
            </div>
            <a href="checkout.html" class="block w-full text-center py-4 bg-primary text-white font-bold rounded-xl hover:bg-black transition-colors">Checkout</a>
        </div>
    </div>

    <script src="../js/cart.js"></script>
    <script src="../js/humbergermenue.js"></script>
</body>
</html>
