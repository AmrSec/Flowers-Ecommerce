<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#f45d96' } } } }
    </script>
    <title>Login / Register</title>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#fce4ec] via-[#f8bbd0] to-primary p-5 font-sans">
    <div class="flex w-full max-w-4xl bg-white rounded-3xl overflow-hidden shadow-2xl min-h-[550px]">
        <div class="hidden md:block w-1/2 bg-primary">
            <img src="../images/loginflower2.jpeg" alt="login" class="w-full h-full object-cover">
        </div>
        <div class="w-full md:w-1/2 p-12 flex flex-col justify-center relative">
            <form id="loginForm" class="space-y-6 transition-all duration-500">
                <h1 class="text-4xl font-bold text-gray-800 text-center mb-8 italic">Login</h1>
                <input type="text" id="loginUsername" placeholder="Username" class="w-full px-5 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-primary outline-none transition-all">
                <input type="password" id="loginPassword" placeholder="Password" class="w-full px-5 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-primary outline-none transition-all">
                <div id="login-message" class="text-center text-sm font-semibold min-h-[20px]"></div>
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-primary to-[#ff80b3] text-white font-bold rounded-2xl shadow-lg hover:-translate-y-1 transition-all">Sign In</button>
                <p class="text-center text-sm text-gray-500">Don't have an account? <span id="goRegister" class="text-primary font-bold cursor-pointer hover:underline">Sign Up</span></p>
            </form>
            
            <form id="registerForm" class="hidden space-y-4">
                <h1 class="text-4xl font-bold text-gray-800 text-center mb-6 italic">Sign Up</h1>
                <input type="text" id="regName" placeholder="Name" class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-primary">
                <input type="email" id="regEmail" placeholder="Email" class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-primary">
                <input type="password" id="regPassword" placeholder="Password" class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-primary">
                <button type="submit" class="w-full py-4 bg-primary text-white font-bold rounded-xl">Create Account</button>
                <p class="text-center text-sm">Already have an account? <span id="goLogin" class="text-primary font-bold cursor-pointer underline">Sign In</span></p>
            </form>
        </div>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
